[project]
name = "demixer"
version = "0.2.0"
description = "Experimental audio-to-production-material pipeline: stems, MIDI, MusicXML scores, DAW-handoff files, and optional musical analysis."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "revelri" }]
dependencies = [
    "essentia>=2.1b6.dev1110",
    "librosa>=0.10.2",
    "music21>=9.1",
    "numpy>=1.26",
    "pretty-midi>=0.2.10",
    "pyloudnorm>=0.1.1",
    "soundfile>=0.12.1",
    "verovio>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyflp>=2.2.1",   # round-trip parser for the .flp writer tests
]
gui = [
    "PySide6>=6.6",
]
worker = [
    "basic-pitch>=0.3.2",
    "beat-this>=0.1.5",
    "demucs>=4.0.1",
    "torch>=2.2",
]
roformer = [
    "audio-separator>=0.30",
]

[project.scripts]
demixer = "demixer.cli.__main__:main"

[project.gui-scripts]
demixer-gui = "demixer.app.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demixer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/demixer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
