name: No AI attribution

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  reject-attribution:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body and commit messages
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const forbidden = /^(?:Co-Authored-By:.*(?:Claude|Anthropic|noreply@anthropic\.com)|Claude-Session:|.*Generated (?:with|by).*Claude.*)$/im;
            const violations = [];
            const body = context.payload.pull_request.body || "";
            if (forbidden.test(body)) violations.push("pull request body");

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            for (const commit of commits) {
              if (forbidden.test(commit.commit.message)) {
                violations.push(`commit ${commit.sha.slice(0, 12)}`);
              }
            }

            if (violations.length) {
              core.setFailed(`AI/Claude attribution is prohibited: ${violations.join(", ")}`);
            }
